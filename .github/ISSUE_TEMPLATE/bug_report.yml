name: Bug Report
description: Report an issue or unexpected behavior in The Ferryman Project
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please ensure you are running the latest version of The Ferryman Project.
  - type: input
    id: version
    attributes:
      label: Ferryman Version
      description: Run `ferryman --version` or `python3 ferryman.py --version`
      placeholder: "e.g. 0.2.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - macOS
        - Linux (systemd)
        - Linux (cron / other)
        - Windows
        - Other (please specify below)
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Run `python3 --version`
      placeholder: "e.g. Python 3.11.4"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'ferryman dawn --voice'
        2. Enter ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output or Traceback
      description: Please copy and paste any error logs or stack traces here.
      render: shell
